<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 900" role="img" aria-labelledby="title desc">
  <title id="title">Upear 总体架构：SafeHarness 安全层 × 平台基座</title>
  <desc id="desc">左侧为 SafeHarness 安全层（本项目核心原创，八个模块），右侧为平台基座（HugAgentOS 基础设施 + 本项目平台扩展），安全层对平台基座的全部执行路径实施强制管控。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", Inter, "Segoe UI", Arial, sans-serif; }
      .sec-bg { fill: #fdf1f0; stroke: #c40000; stroke-width: 6; }
      .sec-title { fill: #c40000; font-size: 38px; font-weight: 800; }
      .sec-tag { fill: #c40000; font-size: 22px; font-weight: 600; }
      .sec-box { fill: #fff; stroke: #c40000; stroke-width: 4; }
      .sec-box-t { fill: #c40000; font-size: 27px; font-weight: 800; }
      .sec-box-s { fill: #555; font-size: 20px; font-weight: 500; }
      .base-bg { fill: #f4f8fc; stroke: #24569f; stroke-width: 6; }
      .base-title { fill: #2559a5; font-size: 38px; font-weight: 800; }
      .base-tag { fill: #2559a5; font-size: 22px; font-weight: 600; }
      .base-box { fill: #fff; stroke: #24569f; stroke-width: 4; }
      .base-box-t { fill: #171717; font-size: 26px; font-weight: 700; }
      .base-box-s { fill: #555; font-size: 20px; font-weight: 500; }
      .flow { stroke: #c40000; stroke-width: 7; fill: none; marker-end: url(#arr); }
      .flow-label { fill: #c40000; font-size: 24px; font-weight: 800; }
      .note { fill: #875600; font-size: 22px; font-weight: 600; }
    </style>
    <marker id="arr" markerWidth="14" markerHeight="11" refX="12" refY="5.5" orient="auto">
      <path d="M0,0 L14,5.5 L0,11 z" fill="#c40000"/>
    </marker>
  </defs>

  <!-- SafeHarness layer -->
  <rect x="30" y="60" width="940" height="780" class="sec-bg"/>
  <text x="62" y="130" class="sec-title">SafeHarness 安全层</text>
  <text x="520" y="130" class="sec-tag">fork 自 SafeHarness 官方实现 · 本项目生产化扩展</text>

  <rect x="62" y="165" width="420" height="130" class="sec-box"/>
  <text x="88" y="212" class="sec-box-t">输入防线</text>
  <text x="88" y="250" class="sec-box-s">正则模式 + 语义 Judge，fail-closed</text>
  <rect x="510" y="165" width="420" height="130" class="sec-box"/>
  <text x="536" y="212" class="sec-box-t">能力门</text>
  <text x="536" y="250" class="sec-box-s">签名令牌 + 特权分离</text>

  <rect x="62" y="325" width="420" height="130" class="sec-box"/>
  <text x="88" y="372" class="sec-box-t">工具网关</text>
  <text x="88" y="410" class="sec-box-s">强制回执 + 原子消费</text>
  <rect x="510" y="325" width="420" height="130" class="sec-box"/>
  <text x="536" y="372" class="sec-box-t">运行监督</text>
  <text x="536" y="410" class="sec-box-s">触发 → 语义复核 → 人工队列</text>

  <rect x="62" y="485" width="420" height="130" class="sec-box"/>
  <text x="88" y="532" class="sec-box-t">策略中心</text>
  <text x="88" y="570" class="sec-box-s">热规则 · 链式 · 回滚 · AI 起草</text>
  <rect x="510" y="485" width="420" height="130" class="sec-box"/>
  <text x="536" y="532" class="sec-box-t">MCP 守卫</text>
  <text x="536" y="570" class="sec-box-s">描述扫描 + 策略中间件</text>

  <rect x="62" y="645" width="420" height="130" class="sec-box"/>
  <text x="88" y="692" class="sec-box-t">轨迹链</text>
  <text x="88" y="730" class="sec-box-s">跨工具链式规则 + 熵检测</text>
  <rect x="510" y="645" width="420" height="130" class="sec-box"/>
  <text x="536" y="692" class="sec-box-t">审计脱敏</text>
  <text x="536" y="730" class="sec-box-s">WAL 账本 · 攻击原文不落账</text>

  <!-- platform base -->
  <rect x="1030" y="60" width="940" height="780" class="base-bg"/>
  <text x="1062" y="130" class="base-title">平台基座</text>
  <text x="1480" y="130" class="base-tag">HugAgentOS 基础设施 + 本项目平台扩展</text>

  <rect x="1062" y="165" width="420" height="130" class="base-box"/>
  <text x="1088" y="212" class="base-box-t">受保护对话链</text>
  <text x="1088" y="250" class="base-box-s">结构防线 → 语义 Judge → 分流</text>
  <rect x="1510" y="165" width="420" height="130" class="base-box"/>
  <text x="1536" y="212" class="base-box-t">FSM 规划模式</text>
  <text x="1536" y="250" class="base-box-s">LLM 提案 + 确定性编译</text>

  <rect x="1062" y="325" width="420" height="130" class="base-box"/>
  <text x="1088" y="372" class="base-box-t">外部智能体桥</text>
  <text x="1088" y="410" class="base-box-s">AutoGen / OpenAI / smolagents</text>
  <rect x="1510" y="325" width="420" height="130" class="base-box"/>
  <text x="1536" y="372" class="base-box-t">MCP 工具市场</text>
  <text x="1536" y="410" class="base-box-s">检索 / 搜索 / 研发 / 业务系统</text>

  <rect x="1062" y="485" width="420" height="130" class="base-box"/>
  <text x="1088" y="532" class="base-box-t">技能 / 记忆 / 沙盒</text>
  <text x="1088" y="570" class="base-box-s">引擎层（可进化）</text>
  <rect x="1510" y="485" width="420" height="130" class="base-box"/>
  <text x="1536" y="532" class="base-box-t">安全运营前端</text>
  <text x="1536" y="570" class="base-box-s">策略中心 · 复核工作台</text>

  <rect x="1062" y="645" width="420" height="130" class="base-box"/>
  <text x="1088" y="692" class="base-box-t">知识库 RAG + 本体</text>
  <text x="1088" y="730" class="base-box-s">检索 / 引用溯源</text>
  <rect x="1510" y="645" width="420" height="130" class="base-box"/>
  <text x="1536" y="692" class="base-box-t">通信网关</text>
  <text x="1536" y="730" class="base-box-s">租户拓扑 + 有界委托</text>

  <!-- enforcement arrows -->
  <path d="M 970 260 L 1062 260" class="flow"/>
  <path d="M 970 420 L 1062 420" class="flow"/>
  <path d="M 970 580 L 1062 580" class="flow"/>
  <path d="M 970 710 L 1062 710" class="flow"/>

  <text x="770" y="880" class="flow-label">强制管控：消息入口 · 工具执行 · 记忆写入 · 全链审计 —— 安全层只增拦截，不放行、不降级</text>
  <text x="770" y="860" class="note" opacity="0">spacer</text>
</svg>
