# SafeHarness Experiment Configuration
# All tuneable parameters are defined here — nothing is hardcoded.

project:
  name: "SafeHarness"
  output_dir: "output"

data:
  dataset_name: "thu-coai/Agent-SafetyBench"
  local_dir: "data/agent_safety_bench"
  fallback_url: "https://raw.githubusercontent.com/thu-coai/Agent-SafetyBench/main/data"
  # First 200 tasks of released_data.json (file order, no shuffle). See released_data_first200.json.
  dataset_file: "data/agent_safety_bench/released_data_first200.json"
  sequential_subset: true
  demo_subset_size: 3
  experiment_subset_size: 200

models:
  # Agent and Judge models MUST be different to avoid self-evaluation bias.
  # Short names must match MODEL_FUNC_MAP in llm_api.py (or use raw gateway model ids if enabled).
  agent_models:
    # - "sonnet4.6"
    # - "gpt5.4"
    - "deepseek_chat"
    # - "deepseek_reasoner"
    # - "claude3haiku"
  judge_model: "gpt4omini" # "gpt4o" is also supported


harness:
  types:
    # - "direct"
    - "react"
    - "multi_agent"
    # - "map_reduce"
    - "memskill"
  react_max_steps: 5
  multi_agent_max_revisions: 2
  map_reduce_max_subtasks: 3
  memskill_react_steps: 5        # ReAct loop steps in Phase 2
  memskill_top_k: 3              # number of skills selected per span
  memskill_retrieve_k: 10        # memories retrieved per turn
  # Optional: LLM-based skill-bank evolution (add skill or refine existing)
  memskill_evolve_skills: true
  memskill_max_skills: 12       # cap total skills (4 defaults + evolved)
  memskill_evolve_after_phase1: true   # Phase 2 sees evolved bank when true
  memskill_evolve_end_task: false     # extra LLM call after ReAct; use for logging / future persist

security_modes:
  - "unprotected"
  - "system_prompt"
  - "guardrail"
  - "llamafirewall"
  - "safe_harness"

safety:
  # Layer numbering follows the paper:
  #   layer1 = L1 Inform    (adversarial context filtering)
  #   layer2 = L2 Verify    (three-tier causal safety verification)
  #   layer3 = L3 Constrain (privilege-separated tool control)
  #   layer4 = L4 Correct   (rollback & adaptive degradation/recovery)
  layer1:
    always_semantic: false  # set true to run LLM semantic check on every input
    suspicious_patterns:
      - "ignore previous instructions"
      - "disregard all prior"
      - "system prompt override"
      - "IMPORTANT: new instructions"
      - "you must now"
      - "forget everything"
      - "you are now"
      - "new role"
      - "override.*(?:policy|instruction)"
      - "act as.*(?:admin|root|sudo)"
  layer2:
    tau_low: 0.3
    tau_high: 0.7
  layer3:
    token_ttl: 600
    token_max_invocations: 50
    denied_paths:
      - "/etc"
      - "/root"
    # Tool risk tiers are defined in src/tools/registry.py build_default_registry()
    # and cannot be overridden from config. See that function for the mapping.
  layer4:
    checkpoint_interval: 3
    max_degradation_level: 3
    recovery_window: 5
  entropy:
    window_size: 20
    threshold: 0.3

attacks:
  types:
    - "context_poisoning"
    - "indirect_injection"
    - "tool_tampering"
    - "memory_injection"
    - "composite"

parallel:
  max_workers: 8

evaluation:
  llm_judge:
    temperature: 0.0
  metrics:
    - "ubr"
    - "asr"
    - "tcr"
    - "ua"
    - "nnh"
    - "orr"
  bootstrap_samples: 1000

# Ablation configurations: each entry disables specific layers.
# Used by run_experiment.py --ablation
ablation:
  configs:
    - name: "full"
      disable_layers: []
    - name: "w/o_L1"
      disable_layers: ["l1"]
    - name: "w/o_L2"
      disable_layers: ["l2"]
    - name: "w/o_L3"
      disable_layers: ["l3"]
    - name: "w/o_L4"
      disable_layers: ["l4"]
    - name: "w/o_memory"
      disable_layers: ["memory"]
  subset_size: 50
  harness_types:
    - "react"
    - "multi_agent"
    - "memskill"